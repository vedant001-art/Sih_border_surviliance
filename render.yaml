services:
  - type: web
    name: sih-border-surveillance-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: sih-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://sih-eight-red.vercel.app,https://sih-aliruegjq-vedantdeshmukh634-7682s-projects.vercel.app"
      - key: ENVIRONMENT
        value: production

databases:
  - name: sih-db
    databaseName: border_surveillance
    user: border_user
    plan: free
    region: singapore
